[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "official-cheater"
version = "0.1.0"
description = "A Python utility for parsing, extracting, and processing data from Hy-Tek Meet Manager PDF files."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "reportlab>=5.0.0"
]
requires-python = ">=3.10"

[project.scripts]
official-cheater = "official_cheater.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.pyright]
typeCheckingMode = "basic"