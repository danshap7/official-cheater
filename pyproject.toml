[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "official-cheater"
version = "0.0.1"
description = "A Python utility for parsing, extracting, and processing data from Hy-Tek Meet Manager PDFs."
readme = "README.md"
authors = [{name = "Dan Shapiro", email = "danshap7@gmail.com"}]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "reportlab>=5.0.0",
    "tzdata>=2026.3",
"openpyxl>=3.1.5",
"psutil>=7.0.0"
]
[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyright",
    "build",
]

requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/danshap7/official-cheater"
Repository = "https://github.com/danshap7/official-cheater"


[project.scripts]
official-cheater = "official_cheater.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.pyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
